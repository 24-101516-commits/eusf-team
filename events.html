<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>EUSF | Events</title>
</head>
<body class="events-page">
<header class="header">
<div class="logo">
<img src="img/event34.png" alt="EUSF Logo">
</div>
<nav class="nav">
<ul>
<li><a href="#" id="nav-home"></a></li>
<li><a href="index.html" id="nav-news"></a></li>
<li><a href="events.html" id="nav-events"></a></li>
<li><a href="#" id="nav-universities"></a></li>
<li><a href="#" id="nav-matches"></a></li>

<li><a href="#" id="nav-about"></a></li>
<li><a href="#" id="nav-contact"></a></li>
</ul>
</nav>
<button id="live-btn"></button>
</header>
<main>
<section class="hero">
<div class="hero-text">
<h1 id="hero-title"></h1>
<p id="hero-description"></p>
</div>
<div class="breadcrumb">
<a href="#" id="breadcrumb-home"></a>
<span id="breadcrumb-events"></span>
</div>
</section>
<section class="highlights">
<div class="title">
<span id="featured-label"></span>
<h2 id="featured-title"></h2>
<p id="featured-description"></p>
<a href="#" id="featured-link"></a>
</div>
<ul class="highlight-cards">
<li class="highlight-card first-card">
<img src="img/event2.jpg" alt="Featured Event">
<div class="highlight-info">
<span id="featured-tag1"></span>
<h3 id="featured-name1"></h3>
<p id="featured-location1"></p>
</div>
</li>
<li class="highlight-card">
<img src="img/event 3.jpg" alt="Sports Agreement">
<div class="highlight-info">
<span id="featured-tag2"></span>
<h3 id="featured-name2"></h3>
<p id="featured-location2"></p>
</div>
</li>
<li class="highlight-card">
<img src="img/event.jpg" alt="Sports Workshop">
<div class="highlight-info">
<span id="featured-tag3"></span>
<h3 id="featured-name3"></h3>
<p id="featured-location3"></p>
</div>
</li>
</ul>
<div class="dots">
<span></span>
<span></span>
<span></span>
<span></span>
</div>
</section>
<section class="find-events">
<div class="find-header">
<div class="title">
<span id="explore-label"></span>
<h2 id="explore-title"></h2>
<p id="explore-description"></p>
</div>
<div class="filters">
<input type="text" id="search">
<div class="filter-options">
<input type="date" id="date">
<select id="category">
<option id="category-all"></option>
<option id="category-competitions"></option>
<option id="category-workshops"></option>
<option id="category-conferences"></option>
</select>
<select id="location">
<option id="location-all"></option>
<option id="location-cairo"></option>
<option id="location-alex"></option>
</select>
<button type="button" id="filter-btn"></button>
</div>
</div>
</div>
<ul class="event-cards">
<li class="event-card">
<img src="img/5.jpeg" alt="Competitions">
<div class="event-info">
<span id="event-tag1"></span>
<div class="event-details">
<div class="event-date">
<strong id="event-day1"></strong>
<span id="event-month1"></span>
<span id="event-year1"></span>
</div>
<div>
<h3 id="event-title1"></h3>
<p id="event-place1"></p>
<a href="#" id="event-read1"></a>
</div>
</div>
</div>
</li>
<li class="event-card">
<img src="img/event.jpg" alt="Workshops">
<div class="event-info">
<span id="event-tag2"></span>
<div class="event-details">
<div class="event-date">
<strong id="event-day2"></strong>
<span id="event-month2"></span>
<span id="event-year2"></span>
</div>
<div>
<h3 id="event-title2"></h3>
<p id="event-place2"></p>
<a href="#" id="event-read2"></a>
</div>
</div>
</div>
</li>
<li class="event-card">
<img src="img/event 6.jpg" alt="Conferences">
<div class="event-info">
<span id="event-tag3"></span>
<div class="event-details">
<div class="event-date">
<strong id="event-day3"></strong>

<span id="event-year3"></span>
</div>
<div>
<h3 id="event-title3"></h3>

</div>
</div>
