<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
<title>EUSF | News</title>
</head>
<body class="news-page">
<header class="header">
<div class="logo">
<img src="img/event34.png" alt="EUSF Logo">
</div>

<nav class="nav">
<ul>
<li><a href="#" id="nav-home"></a></li>
<li><a href="index.html" id="nav-news"></a></li>
<li><a href="events.html" id="nav-events"></a></li>
<li><a href="#" id="nav-universities"></a></li>
<li><a href="#" id="nav-matches"></a></li>
<li><a href="#" id="nav-shield"></a></li>
<li><a href="#" id="nav-medals"></a></li>
<li><a href="#" id="nav-about"></a></li>
<li><a href="#" id="nav-contact"></a></li>
</ul>
</nav>
<button id="live-btn"></button>
</header>
<main>
<section class="hero">
<div class="hero-text">
<h1 id="hero-title"></h1>
<p id="hero-description"></p>
</div>
<div class="breadcrumb">
<a href="#" id="breadcrumb-home"></a>
<span id="breadcrumb-news"></span>
</div>
</section>

<section class="top-news">
<div class="title">
<span id="featured-label"></span>
<h2 id="top-title"></h2>
<p id="top-description"></p>
<a href="#" id="view-all"></a>
</div>
<ul class="cards">
<li class="card">
<img id="top-img1" src="img/1.jpg" alt="News">
<div class="info">
<span id="top-tag1"></span>
<p id="top-date1"></p>
<h3 id="top-news1"></h3>
<a href="#" id="top-read1"></a>
</div>
</li>

<li class="card">
<img id="top-img2" src="img/2.jpg" alt="News">
<div class="info">
<span id="top-tag2"></span>
<p id="top-date2"></p>
<h3 id="top-news2"></h3>
<a href="#" id="top-read2"></a>
</div>
</li>
<li class="card">
<img id="top-img3" src="img/3.jpg" alt="News">
<div class="info">
<span id="top-tag3"></span>
<p id="top-date3"></p>
<h3 id="top-news3"></h3>
<a href="#" id="top-read3"></a>
</div>
</li>
</ul>
</section>


<section class="browse-news">
<div class="title">
<span id="explore-label"></span>
<h2 id="browse-title"></h2>
<p id="browse-description"></p>
</div>
<div class="filters">
<input type="text" id="search" placeholder="Search for news...">
<input type="date" id="date">
<select id="category">
<option value="all" id="category-all"></option>
<option value="Competitions" id="category-competitions"></option>
<option value="Events" id="category-events"></option>
<option value="Conferences" id="category-conferences"></option>
</select>
<select id="sort">
<option id="sort-latest"></option>
<option id="sort-oldest"></option>
</select>
<button id="filter-btn"></button>
</div>
<ul class="cards">
<li class="card">
<img src="img/4.jpg" alt="News">
<div class="info">
<span id="news-tag1"></span>
<p id="news-date1"></p>
<h3 id="news-title1"></h3>
<a href="#" id="news-read1"></a>
</div>
</li>
<li class="card">
<img src="img/5.jpeg" alt="News">
<div class="info">
<span id="news-tag2"></span>
<p id="news-date2"></p>
<h3 id="news-title2"></h3>
<a href="#" id="news-read2"></a>
</div>
</li>
<li class="card">
<img src="img/7.jpg" alt="News">
<div class="info">
<span id="news-tag3"></span>
<p id="news-date3"></p>
<h3 id="news-title3"></h3>
<a href="#" id="news-read3"></a>
</div>
</li>
<li class="card">
<img src="img/10.jpg" alt="News">
<div class="info">
<span id="news-tag4"></span>
<p id="news-date4"></p>
<h3 id="news-title4"></h3>
<a href="#" id="news-read4"></a>
</div>
</li>
</ul>
</section>
